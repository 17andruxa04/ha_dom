# Освещение улица
- alias: "Включение ламп каждые 10 минут ночью"
  triggers:
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "01:00:00"
        - condition: sun
          before: sunrise
          before_offset: "-01:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.zg_gw_light_str_west
          - light.zg_gw_light_str_north

- alias: "Выключение ламп каждые 10 минут днем"
  triggers:
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: and
      conditions:
        - condition: sun
          after: sunrise
          after_offset: "-01:00:00"
        - condition: sun
          before: sunset
          before_offset: "01:00:00"
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.zg_gw_light_str_west
          - light.zg_gw_light_str_north