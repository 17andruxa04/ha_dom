
# Освещение СУ 2-этаж
- alias: Управление светом wc2
  triggers:
    # Триггер для включения света
    - trigger: state
      entity_id: binary_sensor.wf_tl_hum_det_wc2_dvizhenie
      to: "on"
    # Триггер для выключения света через 2 минуты после отсутствия движения
    - trigger: state
      entity_id: binary_sensor.wf_tl_hum_det_wc2_dvizhenie
      to: "off"
      for: "00:00:02"
  actions:
    - choose:
        # Действие для включения света
        - conditions:
            - condition: state
              entity_id: binary_sensor.wf_tl_hum_det_wc2_dvizhenie
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.zg_gw_light_wc2_osveshchenie
                  - light.zg_gw_light_wc2_osveshchenie_2
        # Действие для выключения света
        - conditions:
            - condition: state
              entity_id: binary_sensor.wf_tl_hum_det_wc2_dvizhenie
              state: "off"
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.zg_gw_light_wc2_osveshchenie
                  - light.zg_gw_light_wc2_osveshchenie_2

