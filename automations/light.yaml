# Освещение ХОЛЛ
# Включаем свет в холле по движению, только если движение длится 20 секунд
# освещенность меньше 200 lx и время не между 00:00 и 07:00
# Выключаем свет, если движения нет 2 секунды
- alias: Управление светом hall
  triggers:
    - trigger: state
      entity_id: binary_sensor.zg_gw_temp_hall
      to: "on"
      for: "00:00:20"
    - trigger: state
      entity_id: binary_sensor.zg_gw_temp_hall
      to: "off"
      for: "00:00:02"
  actions:
    - choose:
        # Включение света только при движении и низкой освещенности
        - conditions:
            - condition: state
              entity_id: binary_sensor.zg_gw_temp_hall
              state: "on"
            - condition: time
              after: "07:00:00"
              before: "23:59:59"
            - condition: numeric_state
              entity_id: sensor.zg_gw_temp_hall_osveshchennost
              below: 200
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.zg_gw_light_hall_osveshchenie

        # Выключение света при отсутствии движения
        - conditions:
            - condition: state
              entity_id: binary_sensor.zg_gw_temp_hall
              state: "off"
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.zg_gw_light_hall_osveshchenie
                  - light.zg_gw_light_hall_osveshchenie_2

# Освещение улица
- alias: "Включение ламп каждые 10 минут ночью"
  triggers:
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "01:00:00"
        - condition: sun
          before: sunrise
          before_offset: "-01:00:00"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.zg_gw_light_str_west
          - light.zg_gw_light_str_north

- alias: "Выключение ламп каждые 10 минут днем"
  triggers:
    - trigger: time_pattern
      minutes: "/10"
  conditions:
    - condition: and
      conditions:
        - condition: sun
          after: sunrise
          after_offset: "-01:00:00"
        - condition: sun
          before: sunset
          before_offset: "01:00:00"
  actions:
    - action: light.turn_off
      target:
        entity_id:
          - light.zg_gw_light_str_west
          - light.zg_gw_light_str_north
