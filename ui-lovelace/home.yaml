

- type: vertical-stack
  cards:   

  - type: weather-forecast
    entity: weather.forecast_home_assistant

  - type: horizontal-stack
    cards:
      - type: entities
        entities:
          - entity: sensor.sun_next_dawn
          - entity: sensor.sun_next_setting

  - type: entities
    show_header_toggle: false
    entities:

      - entity: person.nikita
        type: custom:multiple-entity-row
        name:  Никита
        icon: mdi:account
        toggle: false
        state_color: true
#                  state_header: heat
        entities:
          - entity: sensor.iphone_nikita_battery_level
            name: false
          - entity: sensor.iphone_nikita_battery_level
            name: false
            icon: mdi:battery

      - entity: person.yehor
        type: custom:multiple-entity-row
        name:  Егор
        icon: mdi:account
        toggle: false
        state_color: true
#                  state_header: heat
        entities:
          - entity: sensor.iphone_yehor_battery_level
            name: false
          - entity: sensor.iphone_yehor_battery_level
            name: false
            icon: mdi:battery

  - type: entities
    entities:
      - entity: sensor.temperature_and_humidity_alarm_humidity
        name: Влажность
      - entity: sensor.temperature_and_humidity_alarm_illuminance
        name: Освещенность
      - entity: sensor.temperature_and_humidity_alarm_temperature
        name: Температура
    title: Текущая погода

  - type: history-graph
    title: 'График температуры улица'
    hours_to_show: 72
    entities:
      - entity: sensor.temperature_and_humidity_alarm_temperature
        name: Температура


- type: vertical-stack
  cards:   

  - type: horizontal-stack
    cards:
      - type: gauge
        name: CPU
        unit: '%'
        entity: sensor.processor_use
        severity:
            green: 0
            yellow: 45
            red: 85
      - type: gauge
        name: Disk
        unit: '%'
        entity: sensor.disk_use_percent
        severity:
            green: 0
            yellow: 45
            red: 85
      - type: gauge
        name: CPU
        unit: '°C'
        entity: sensor.processor_temperature
        severity:
            green: 0
            yellow: 30
            red: 60
      - type: gauge
        name: RAM
        unit: '%'
        entity: sensor.memory_use_percent
        severity:
            green: 0
            yellow: 30
            red: 60

- type: vertical-stack
  cards:    
  
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.current_time
        name: Текущее время 
        icon: mdi:clock
      - entity: sensor.current_date
        name: Дата
        icon: mdi:calendar
      - entity: sensor.maria_db_size
        name: Объем БД
        icon: mdi:database
      - entity: sensor.last_boot
        name: Крайняя перезагрузка
        icon: mdi:av-timer

# Кнопка для перезагрузки плиты
  - type: horizontal-stack
    cards:

      - type: button
        entity: switch.wf_tl_phase_a_din
        name: Фаза 'А' кухня

