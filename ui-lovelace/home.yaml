- type: vertical-stack
  cards:
    - type: weather-forecast
      entity: weather.forecast_home_assistant

    - type: horizontal-stack
      cards:
        - type: entities
          entities:
            - entity: sensor.sun_next_dawn
            - entity: sensor.sun_next_setting

    - type: entities
      show_header_toggle: false
      entities:
        - entity: person.nikita
          type: custom:multiple-entity-row
          name: Никита
          icon: mdi:account
          toggle: false
          state_color: true
          #                  state_header: heat
          entities:
            - entity: sensor.iphone_nikita_battery_level
              name: false
            - entity: sensor.iphone_nikita_battery_level
              name: false
              icon: mdi:battery

        - entity: person.yehor
          type: custom:multiple-entity-row
          name: Егор
          icon: mdi:account
          toggle: false
          state_color: true
          #                  state_header: heat
          entities:
            - entity: sensor.iphone_yehor_battery_level
              name: false
            - entity: sensor.iphone_yehor_battery_level
              name: false
              icon: mdi:battery

    - type: entities
      entities:
        - entity: sensor.temperature_and_humidity_alarm_humidity
          name: Влажность
        - entity: sensor.temperature_and_humidity_alarm_illuminance
          name: Освещенность
        - entity: sensor.temperature_and_humidity_alarm_temperature
          name: Температура
      title: Текущая погода

    - type: history-graph
      title: "График температуры улица"
      hours_to_show: 72
      entities:
        - entity: sensor.temperature_and_humidity_alarm_temperature
          name: Температура

- type: vertical-stack
  cards:
    - type: horizontal-stack
      cards:
        - type: gauge
          name: CPU
          unit: "%"
          entity: sensor.processor_use
          severity:
            green: 0
            yellow: 45
            red: 85
        - type: gauge
          name: Disk
          unit: "%"
          entity: sensor.disk_use_percent
          severity:
            green: 0
            yellow: 45
            red: 85
        - type: gauge
          name: CPU
          unit: "°C"
          entity: sensor.processor_temperature
          severity:
            green: 0
            yellow: 30
            red: 60
        - type: gauge
          name: RAM
          unit: "%"
          entity: sensor.memory_use_percent
          severity:
            green: 0
            yellow: 30
            red: 60

- type: vertical-stack
  cards:
    - type: entities
      show_header_toggle: false
      entities:
        - entity: sensor.current_time
          name: Текущее время
          icon: mdi:clock
        - entity: sensor.current_date
          name: Дата
          icon: mdi:calendar
        - entity: sensor.maria_db_size
          name: Объем БД
          icon: mdi:database
        - entity: sensor.last_boot
          name: Крайняя перезагрузка
          icon: mdi:av-timer

    # Кнопка для перезагрузки плиты
    - type: horizontal-stack
      cards:
        - type: grid
          columns: 2
          square: false
          cards:
            # Фаза
            - type: "custom:button-card"
              entity: switch.wf_tl_phase_a_din
              name: Фаза 'A' кухня
              icon: mdi:power-plug
              show_state: false
              color: auto
              styles:
                card:
                  - height: 150px
                  - padding: 0
                grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: 1fr auto
                  - justify-items: center
                  - align-items: center
                img_cell:
                  - justify-content: center
                  - align-items: center
                  - width: 100%
                  - height: 100%
                icon:
                  - width: 78px
                  - height: 78px
                name:
                  - text-align: center
                  - color: "var(--primary-text-color)"
                  - font-size: 16px
                  - padding-bottom: 14px

              tap_action:
                action: toggle

            # Полив
            - type: "custom:button-card"
              entity: light.zg_gw_watering_home
              name: Полив газона
              icon: mdi:sprinkler-variant
              show_state: true
              color: auto
              styles:
                card:
                  - height: 150px
                  - padding: 0
                grid:
                  - grid-template-areas: '"i" "n" "s"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: 1fr auto auto
                  - justify-items: center
                  - align-items: center
                img_cell:
                  - justify-content: center
                  - align-items: center
                  - width: 100%
                  - height: 100%
                icon:
                  - width: 78px
                  - height: 78px
                name:
                  - text-align: center
                  - color: "var(--primary-text-color)"
                  - font-size: 16px
                state:
                  - text-align: center
                  - color: "var(--secondary-text-color)"
                  - font-size: 12px
                  - padding-bottom: 10px

              tap_action:
                action: toggle

            # Гараж
            - type: "custom:button-card"
              entity: cover.wf_tl_garage_door
              name: Гараж
              show_state: false
              color: auto
              icon: >
                [[[
                  return entity.state === 'open' ? 'mdi:garage-open' : 'mdi:garage';
                ]]]
              styles:
                card:
                  - height: 150px
                  - padding: 0
                grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: 1fr auto
                  - justify-items: center
                  - align-items: center
                img_cell:
                  - justify-content: center
                  - align-items: center
                  - width: 100%
                  - height: 100%
                icon:
                  - width: 78px
                  - height: 78px
                  - color: >
                      [[[
                        return entity.state === 'open'
                          ? '#fbc02d'
                          : 'var(--state-icon-color)';
                      ]]]
                name:
                  - text-align: center
                  - color: "var(--primary-text-color)"
                  - font-size: 16px
                  - padding-bottom: 14px

              tap_action:
                action: toggle

              hold_action:
                action: more-info

            # Ворота
            - type: "custom:button-card"
              entity: cover.wf_tl_gate_door
              name: Ворота
              show_state: false
              color: auto
              icon: >
                [[[
                  return entity.state === 'open' ? 'mdi:gate-open' : 'mdi:gate';
                ]]]
              styles:
                card:
                  - height: 150px
                  - padding: 0
                grid:
                  - grid-template-areas: '"i" "n"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: 1fr auto
                  - justify-items: center
                  - align-items: center
                img_cell:
                  - justify-content: center
                  - align-items: center
                  - width: 100%
                  - height: 100%
                icon:
                  - width: 78px
                  - height: 78px
                  - color: >
                      [[[
                        return entity.state === 'open'
                          ? '#fbc02d'
                          : 'var(--state-icon-color)';
                      ]]]
                name:
                  - text-align: center
                  - color: "var(--primary-text-color)"
                  - font-size: 16px
                  - padding-bottom: 14px

              tap_action:
                action: toggle

              hold_action:
                action: more-info

    - type: horizontal-stack
      cards:
        - type: "custom:button-card"
          entity: light.zg_gw_central_wate_taps_osveshchenie
          name: Водопровод
          icon: mdi:pipe
          show_state: true
          show_label: false
          triggers_update:
            - light.zg_gw_central_wate_taps_osveshchenie
            - light.zg_gw_central_wate_taps_osveshchenie_2
            - light.zg_gw_automatic_pump
          state_display: >
            [[[
              const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
              const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
              const pump = states['light.zg_gw_automatic_pump']?.state;
              if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return 'Активен';
              if (tap1 === 'on' && tap2 === 'on') return 'Выключен';
              return 'Переходное состояние';
            ]]]
          styles:
            card:
              - height: 110px
            icon:
              - color: >
                  [[[
                    const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
                    const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
                    const pump = states['light.zg_gw_automatic_pump']?.state;
                    if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return '#42a5f5';
                    if (tap1 === 'on' && tap2 === 'on') return 'var(--disabled-text-color)';
                    return '#fb8c00';
                  ]]]
            state:
              - color: >
                  [[[
                    const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
                    const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
                    const pump = states['light.zg_gw_automatic_pump']?.state;
                    if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return '#42a5f5';
                    if (tap1 === 'on' && tap2 === 'on') return 'var(--disabled-text-color)';
                    return '#fb8c00';
                  ]]]
          tap_action:
            action: call-service
            service: light.turn_off
            target:
              entity_id:
                - light.zg_gw_central_wate_taps_osveshchenie
                - light.zg_gw_central_wate_taps_osveshchenie_2
                - light.zg_gw_automatic_pump
          hold_action:
            action: more-info

        - type: "custom:button-card"
          entity: light.zg_gw_central_wate_taps_osveshchenie
          name: Скважина
          icon: mdi:water-pump
          show_state: true
          show_label: false
          triggers_update:
            - light.zg_gw_central_wate_taps_osveshchenie
            - light.zg_gw_central_wate_taps_osveshchenie_2
            - light.zg_gw_automatic_pump
          state_display: >
            [[[
              const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
              const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
              const pump = states['light.zg_gw_automatic_pump']?.state;
              if (tap1 === 'on' && tap2 === 'on' && pump === 'on') return 'Активна';
              if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return 'Выключена';
              return 'Переходное состояние';
            ]]]
          styles:
            card:
              - height: 110px
            icon:
              - color: >
                  [[[
                    const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
                    const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
                    const pump = states['light.zg_gw_automatic_pump']?.state;
                    if (tap1 === 'on' && tap2 === 'on' && pump === 'on') return '#26c6da';
                    if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return 'var(--disabled-text-color)';
                    return '#fb8c00';
                  ]]]
            state:
              - color: >
                  [[[
                    const tap1 = states['light.zg_gw_central_wate_taps_osveshchenie']?.state;
                    const tap2 = states['light.zg_gw_central_wate_taps_osveshchenie_2']?.state;
                    const pump = states['light.zg_gw_automatic_pump']?.state;
                    if (tap1 === 'on' && tap2 === 'on' && pump === 'on') return '#26c6da';
                    if (tap1 === 'off' && tap2 === 'off' && pump === 'off') return 'var(--disabled-text-color)';
                    return '#fb8c00';
                  ]]]
          tap_action:
            action: call-service
            service: light.turn_on
            target:
              entity_id:
                - light.zg_gw_central_wate_taps_osveshchenie
                - light.zg_gw_central_wate_taps_osveshchenie_2
                - light.zg_gw_automatic_pump
          hold_action:
            action: more-info

        - type: "custom:button-card"
          entity: light.zg_gw_automatic_pump
          name: Насос
          icon: mdi:engine
          show_state: true
          state_display: >
            [[[
              return entity.state === 'on' ? 'Включен' : 'Выключен';
            ]]]
          styles:
            card:
              - height: 110px
            icon:
              - color: >
                  [[[
                    return entity.state === 'on'
                      ? '#66bb6a'
                      : 'var(--disabled-text-color)';
                  ]]]
            state:
              - color: >
                  [[[
                    return entity.state === 'on'
                      ? '#66bb6a'
                      : 'var(--disabled-text-color)';
                  ]]]
          tap_action:
            action: more-info

